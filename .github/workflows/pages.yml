name: Build and deploy eodigagae
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KAKAO_JS_KEY: ${{ vars.KAKAO_JS_KEY }}
      ENABLE_ANALYTICS: ${{ vars.ENABLE_ANALYTICS || 'false' }}
      ANALYTICS_WORKER_URL: ${{ vars.ANALYTICS_WORKER_URL }}
      NAVER_WORKER_URL: ${{ vars.NAVER_WORKER_URL }}
      NAVER_SEARCH_APPROVED: ${{ vars.NAVER_SEARCH_APPROVED || 'false' }}
      NAVER_IMAGE_APPROVED: ${{ vars.NAVER_IMAGE_APPROVED || 'false' }}
      NAVER_MATCH_APPROVED: ${{ vars.NAVER_MATCH_APPROVED || 'false' }}
      GOOGLE_MODE: ${{ vars.GOOGLE_MODE || 'all' }}
      GOOGLE_WORKER_URL: ${{ vars.GOOGLE_WORKER_URL }}
      IMAGE_ON_CARDS: ${{ vars.IMAGE_ON_CARDS || 'false' }}
      NAVER_BLOG_WORKER_URL: ${{ vars.NAVER_BLOG_WORKER_URL }}
      REVIEW_APIS_APPROVED: ${{ vars.REVIEW_APIS_APPROVED || 'false' }}
      GOOGLE_PHOTOS_ENABLED: ${{ vars.GOOGLE_PHOTOS_ENABLED || 'false' }}
      PYTHONUTF8: "1"
      SITE_URL: https://eodigagae.com
      ALLOW_INDEXING: ${{ vars.ALLOW_INDEXING || 'false' }}
      ENABLE_FORMS: ${{ vars.ENABLE_FORMS || 'false' }}
      PUBLIC_DATA_APPROVED: ${{ vars.PUBLIC_DATA_APPROVED || 'false' }}
      POLICY_APPROVED: ${{ vars.POLICY_APPROVED || 'false' }}
      ADS_POLICY_APPROVED: ${{ vars.ADS_POLICY_APPROVED || 'false' }}
      ENABLE_ADFIT: ${{ vars.ENABLE_ADFIT || 'false' }}
      ADFIT_MID: ${{ vars.ADFIT_MID }}
      ADFIT_BOTTOM: ${{ vars.ADFIT_BOTTOM }}
      FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
      FORM_PROVIDER: ${{ vars.FORM_PROVIDER }}
      FORM_PROVIDER_COUNTRY: ${{ vars.FORM_PROVIDER_COUNTRY }}
      FORM_PROVIDER_CONTACT: ${{ vars.FORM_PROVIDER_CONTACT }}
      FORM_PROVIDER_RETENTION: ${{ vars.FORM_PROVIDER_RETENTION }}
      FORM_FILE_UPLOADS: ${{ vars.FORM_FILE_UPLOADS || 'false' }}
      FORM_INTERNATIONAL_TRANSFER: ${{ vars.FORM_INTERNATIONAL_TRANSFER }}
      KAKAO_CHANNEL_URL: ${{ vars.KAKAO_CHANNEL_URL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      BUSINESS_NAME: ${{ vars.BUSINESS_NAME || '강마케팅' }}
      BUSINESS_REPRESENTATIVE: ${{ vars.BUSINESS_REPRESENTATIVE }}
      BUSINESS_NUMBER: ${{ vars.BUSINESS_NUMBER }}
      BUSINESS_ADDRESS: ${{ vars.BUSINESS_ADDRESS }}
      BUSINESS_PHONE: ${{ vars.BUSINESS_PHONE }}
      BUSINESS_JURISDICTION: ${{ vars.BUSINESS_JURISDICTION }}
      POLICY_EFFECTIVE_DATE: ${{ vars.POLICY_EFFECTIVE_DATE }}
      POLICY_VERSION: ${{ vars.POLICY_VERSION || 'draft-2026-11-25' }}
      ANDROID_PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID || 'com.eodigagae.app' }}
      ANDROID_SHA256_CERT_FINGERPRINTS: ${{ vars.ANDROID_SHA256_CERT_FINGERPRINTS }}
      NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      SHEET_CORRECTIONS_CSV_URL: ${{ vars.SHEET_CORRECTIONS_CSV_URL }}
      SHEET_ADS_CSV_URL: ${{ vars.SHEET_ADS_CSV_URL }}
      SHEET_PREMIUM_CSV_URL: ${{ vars.SHEET_PREMIUM_CSV_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -X utf8 build.py && python3 -X utf8 verify.py
      - run: echo "eodigagae.com" > site/CNAME && touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
