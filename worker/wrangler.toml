name = "eodigagae-api"
main = "eodigagae-api.bundle.js"
compatibility_date = "2026-11-25"
workers_dev = true
[vars]
DAILY_LIMIT = "100"
GOOGLE_APPROVED = "false"
GOOGLE_PHOTOS_ENABLED = "false"
GOOGLE_DETAILS_DAILY_LIMIT = "25"
GOOGLE_PHOTOS_DAILY_LIMIT = "25"
GOOGLE_SEARCH_DAILY_LIMIT = "100"
NAVER_SEARCH_APPROVED = "false"
NAVER_IMAGE_APPROVED = "false"
NAVER_MATCH_APPROVED = "false"
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "DailyQuota"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyQuota"]
